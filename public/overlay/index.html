<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Overlay - musingsofmy.today</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #05070a;
      --bg-surface: #0a1218;
      --bg-overlay: rgba(5, 12, 18, 0.85);
      --accent: #22d3ee;
      --accent-bright: #67e8f9;
      --accent-dim: #0e7490;
      --accent-glow: rgba(34, 211, 238, 0.45);
      --gold: #e0a93b;
      --text: #ffffff;
      --text-muted: #9bb0bd;
      --text-subtle: #5c7080;
      --success: #34d399;
      --danger: #f87171;
      --border: rgba(34, 211, 238, 0.28);
      --border-strong: rgba(34, 211, 238, 0.55);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-pill: 999px;
      --font-display: 'Montserrat', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
      font-family: var(--font-body);
      color: var(--text);
      overflow: hidden;
      user-select: none;
    }

    /* Top Bar HUD */
    .top-bar {
      position: absolute;
      top: 14px;
      left: 20px;
      right: 20px;
      height: 48px;
      background: var(--bg-overlay);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 0 16px rgba(34, 211, 238, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(248, 113, 113, 0.18);
      border: 1px solid rgba(248, 113, 113, 0.5);
      color: #ff8585;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--danger);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--danger);
      animation: pulse 1.6s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .log-badge {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .log-badge .dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent);
    }

    .log-badge b {
      color: var(--text);
      font-weight: 600;
    }

    .log-badge .path {
      color: var(--text-subtle);
    }

    /* Stream Title / Current Focus */
    .stream-focus {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .focus-pill {
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid var(--border-strong);
      color: var(--accent-bright);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
    }

    /* Right Ticker / Links */
    .links-section {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
    }

    .links-section .item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .links-section .item span {
      color: var(--accent);
    }

    /* Bottom Info Card / Now Playing / Addon Card */
    .bottom-hud {
      position: absolute;
      bottom: 16px;
      left: 20px;
      width: 420px;
      height: 54px;
      background: var(--bg-overlay);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      overflow: hidden;
    }

    /* Camera Frame Accent Border */
    .cam-frame {
      position: absolute;
      left: 20px;
      top: 761px;
      width: 420px;
      height: 235px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 12px rgba(34, 211, 238, 0.12);
      pointer-events: none;
      z-index: 99;
    }

    .hud-icon {
      width: 32px;
      height: 32px;
      min-width: 32px;
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(14, 116, 144, 0.4));
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
    }

    .hud-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    .hud-title {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud-desc {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- Top Bar HUD -->
  <header class="top-bar">
    <div class="brand-section">
      <div class="live-badge">
        <span class="live-dot"></span> LIVE
      </div>
      <div class="log-badge">
        <span class="dot"></span>
        <b>now.log</b> <span class="path">~/kenhen</span>
      </div>
    </div>

    <div class="stream-focus">
      <span class="focus-pill">WOW FOREVER</span>
      <span>Launch Day · Live Addon Development & Verification</span>
    </div>

    <div class="links-section">
      <div class="item"><span>web</span> musingsofmy.today</div>
      <div class="item"><span>twitch</span> kenhenchan</div>
      <div class="item"><span>threads</span> @kjhenseler</div>
    </div>
  </header>

  <!-- Camera Frame Accent -->
  <div class="cam-frame"></div>

  <!-- Bottom Addon Ticker -->
  <aside class="bottom-hud">
    <div class="hud-icon">GF</div>
    <div class="hud-content">
      <div class="hud-title">GoldFinder v0.2.0 · Live on CurseForge</div>
      <div class="hud-desc">Built for WoW: Forever (1.60.1.70707) · Net Profit</div>
    </div>
  </aside>

  <script>
    // Smooth ticker rotation for bottom HUD
    const tickerItems = [
      { tag: "GF", title: "GoldFinder v0.2.0 · Live on CurseForge", desc: "Built for WoW: Forever (1.60.1.70707) · Net Profit" },
      { tag: "AGY", title: "AgyOrch + AgyBuild Harness", desc: "Autonomous AI Pair Programming & DevSecOps" },
      { tag: "BLOG", title: "musingsofmy.today", desc: "55+ Articles in Markdown · Astro + Workers Edge" }
    ];

    let currentIdx = 0;
    const hudTag = document.querySelector(".hud-icon");
    const hudTitle = document.querySelector(".hud-title");
    const hudDesc = document.querySelector(".hud-desc");

    setInterval(() => {
      currentIdx = (currentIdx + 1) % tickerItems.length;
      const item = tickerItems[currentIdx];
      hudTag.textContent = item.tag;
      hudTitle.textContent = item.title;
      hudDesc.textContent = item.desc;
    }, 12000);
  </script>

</body>
</html>
