<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Overlay - musingsofmy.today</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #05070a;
      --bg-surface: #0a1218;
      --bg-overlay: rgba(5, 12, 18, 0.85);
      --accent: #22d3ee;
      --accent-bright: #67e8f9;
      --accent-dim: #0e7490;
      --accent-glow: rgba(34, 211, 238, 0.45);
      --gold: #e0a93b;
      --text: #ffffff;
      --text-muted: #9bb0bd;
      --text-subtle: #5c7080;
      --success: #34d399;
      --danger: #f87171;
      --border: rgba(34, 211, 238, 0.28);
      --border-strong: rgba(34, 211, 238, 0.55);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-pill: 999px;
      --font-display: 'Montserrat', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
      font-family: var(--font-body);
      color: var(--text);
      overflow: hidden;
      user-select: none;
    }

    /* Top Bar HUD */
    .top-bar {
      position: absolute;
      top: 14px;
      left: 20px;
      right: 20px;
      height: 48px;
      background: var(--bg-overlay);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 0 16px rgba(34, 211, 238, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      overflow: hidden;
    }

    /* Glass Shimmer & Ambient Border Sweep */
    .top-bar::after, .bottom-hud::after {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(34, 211, 238, 0.03) 20%, rgba(103, 232, 249, 0.2) 50%, rgba(34, 211, 238, 0.03) 80%, transparent 100%);
      transform: skewX(-25deg);
      pointer-events: none;
      animation: shimmer 12s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bottom-hud::after {
      animation-delay: 6s;
    }

    @keyframes shimmer {
      0%, 75% { left: -120%; }
      90%, 100% { left: 160%; }
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(248, 113, 113, 0.18);
      border: 1px solid rgba(248, 113, 113, 0.5);
      color: #ff8585;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--danger);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--danger);
      animation: pulse 1.6s infinite ease-in-out;
    }

    .agy-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent-bright);
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.1);
    }

    .agy-badge svg {
      width: 17px;
      height: 14px;
      display: block;
      filter: drop-shadow(0 0 4px rgba(34, 211, 238, 0.5));
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .log-badge {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .log-badge .dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent);
    }

    .log-badge b {
      color: var(--text);
      font-weight: 600;
    }

    .log-badge .path {
      color: var(--text-subtle);
    }

    /* Stream Title / Current Focus */
    .stream-focus {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .focus-pill {
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid var(--border-strong);
      color: var(--accent-bright);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
    }

    /* Right Ticker / Links */
    .links-section {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
    }

    .links-section .item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .links-section .item span {
      color: var(--accent);
    }

    /* Live Digital Clock */
    .hud-clock {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: var(--radius-sm);
      color: var(--accent-bright);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .clock-dot {
      width: 5px;
      height: 5px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--success);
    }

    /* Bottom Info Card / Now Playing / Addon Card */
    .bottom-hud {
      position: absolute;
      bottom: 16px;
      left: 20px;
      width: 420px;
      height: 54px;
      background: var(--bg-overlay);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      overflow: hidden;
    }

    /* Camera Frame Accent Border & Sci-Fi Tech Brackets */
    .cam-frame {
      position: absolute;
      left: 20px;
      top: 761px;
      width: 420px;
      height: 235px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 12px rgba(34, 211, 238, 0.12);
      pointer-events: none;
      z-index: 99;
    }

    .cam-bracket {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--accent-bright);
      border-style: solid;
      pointer-events: none;
      filter: drop-shadow(0 0 4px var(--accent));
    }

    .cam-bracket-tl {
      top: -2px;
      left: -2px;
      border-width: 2px 0 0 2px;
      border-top-left-radius: 6px;
    }

    .cam-bracket-tr {
      top: -2px;
      right: -2px;
      border-width: 2px 2px 0 0;
      border-top-right-radius: 6px;
    }

    .cam-bracket-bl {
      bottom: -2px;
      left: -2px;
      border-width: 0 0 2px 2px;
      border-bottom-left-radius: 6px;
    }

    .cam-bracket-br {
      bottom: -2px;
      right: -2px;
      border-width: 0 2px 2px 0;
      border-bottom-right-radius: 6px;
    }

    .cam-tag {
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-family: var(--font-mono);
      font-size: 8.5px;
      letter-spacing: 0.12em;
      font-weight: 700;
      color: rgba(34, 211, 238, 0.8);
      background: rgba(5, 12, 18, 0.85);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(34, 211, 238, 0.25);
      pointer-events: none;
    }

    /* Center Split Cyber Seam & Framing Notches */
    .split-line {
      position: absolute;
      left: 960px;
      top: 62px;
      bottom: 0;
      width: 1px;
      background: linear-gradient(180deg,
        rgba(34, 211, 238, 0.45) 0%,
        rgba(34, 211, 238, 0.15) 60px,
        rgba(34, 211, 238, 0.05) 50%,
        rgba(34, 211, 238, 0.15) calc(100% - 60px),
        rgba(34, 211, 238, 0.45) 100%
      );
      box-shadow: 0 0 8px rgba(34, 211, 238, 0.15);
      pointer-events: none;
      z-index: 50;
    }

    .split-notch-top {
      position: absolute;
      left: 955px;
      top: 62px;
      width: 11px;
      height: 2px;
      background: var(--accent-bright);
      box-shadow: 0 0 8px var(--accent);
      pointer-events: none;
      z-index: 51;
    }

    .split-notch-bottom {
      position: absolute;
      left: 955px;
      bottom: 0px;
      width: 11px;
      height: 2px;
      background: var(--accent-bright);
      box-shadow: 0 0 8px var(--accent);
      pointer-events: none;
      z-index: 51;
    }

    .hud-icon {
      width: 32px;
      height: 32px;
      min-width: 32px;
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(14, 116, 144, 0.4));
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    .hud-icon.fading {
      transform: scale(0.85);
      opacity: 0.3;
    }

    .hud-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
      transition: opacity 0.32s ease, transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-content.fading {
      opacity: 0;
      transform: translateY(5px);
    }

    .hud-title {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud-desc {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

  <!-- Top Bar HUD -->
  <header class="top-bar">
    <div class="brand-section">
      <div class="live-badge">
        <span class="live-dot"></span> LIVE
      </div>
      <div class="agy-badge">
        <svg><use href="#agy-logo-icon"></use></svg>
        <span>Antigravity CLI</span>
      </div>
      <div class="log-badge">
        <span class="dot"></span>
        <b>now.log</b> <span class="path">~/kenhen</span>
      </div>
    </div>

    <div class="stream-focus">
      <span class="focus-pill">WOW FOREVER</span>
      <span>Launch Day · Live Addon Development & Verification</span>
    </div>

    <div class="links-section">
      <div class="item"><span>web</span> musingsofmy.today</div>
      <div class="item"><span>twitch</span> kenhenchan</div>
      <div class="item"><span>threads</span> @kjhenseler</div>

        <span class="clock-dot"></span>

      </div>
    </div>

  <!-- Center Split Cyber Seam & Framing Notches -->

  <div class="split-notch-top"></div>
  <div class="split-notch-bottom"></div>

  <!-- Camera Frame Accent & Sci-Fi Tech Brackets -->
  <div class="cam-frame">
    <div class="cam-bracket cam-bracket-tl"></div>
    <div class="cam-bracket cam-bracket-tr"></div>
    <div class="cam-bracket cam-bracket-bl"></div>
    <div class="cam-bracket cam-bracket-br"></div>
    <div class="cam-tag">BRIO 4K · 60FPS</div>
  </div>

  <!-- Bottom Addon Ticker -->
  <aside class="bottom-hud">
    <div class="hud-icon">GF</div>
    <div class="hud-content">
      <div class="hud-title">GoldFinder v0.2.0 · Live on CurseForge</div>
      <div class="hud-desc">Built for WoW: Forever (1.60.1.70707) · Net Profit</div>
    </div>
  </aside>

  <script>
    // Live Digital Clock
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-US', {
        hour12: false,
        timeZoneName: 'short'
      });
      const clockEl = document.getElementById('live-clock');
      if (clockEl) clockEl.textContent = timeStr;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Smooth Kinetic Ticker Rotation with micro-fade transition
    const tickerItems = [
      { tag: "GF", title: "GoldFinder v0.2.0 · Live on CurseForge", desc: "Built for WoW: Forever (1.60.1.70707) · Net Profit" },
      { tag: "AGY", title: "AgyOrch + AgyBuild Harness", desc: "Autonomous AI Pair Programming & DevSecOps" },
      { tag: "BLOG", title: "musingsofmy.today", desc: "55+ Articles in Markdown · Astro + Workers Edge" }
    ];

    let currentIdx = 0;
    const hudIcon = document.querySelector(".hud-icon");
    const hudContent = document.querySelector(".hud-content");
    const hudTitle = document.querySelector(".hud-title");
    const hudDesc = document.querySelector(".hud-desc");

    setInterval(() => {
      hudIcon.classList.add("fading");
      hudContent.classList.add("fading");

      setTimeout(() => {
        currentIdx = (currentIdx + 1) % tickerItems.length;
        const item = tickerItems[currentIdx];
        if (item.tag === "AGY") {
          hudIcon.innerHTML = '<svg style="width: 20px; height: 17px; display: block; filter: drop-shadow(0 0 4px rgba(34, 211, 238, 0.5));"><use href="#agy-logo-icon"></use></svg>';
        } else {
          hudIcon.textContent = item.tag;
        }
        hudTitle.textContent = item.title;
        hudDesc.textContent = item.desc;

        hudIcon.classList.remove("fading");
        hudContent.classList.remove("fading");
      }, 320);
    }, 12000);
  </script>
