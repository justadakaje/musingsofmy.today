name: sync projects

on:
  schedule:
    # Weekly on Monday at 13:00 UTC
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sync GoldFinder latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-projects.mjs

      - name: Type-check content and components
        run: npx astro check

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- src/data/home.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/sync-projects
          git add src/data/home.ts
          git commit -m "chore(home): sync GoldFinder release version"
          git push --force origin chore/sync-projects
          existing=$(gh pr list --head chore/sync-projects --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head chore/sync-projects \
              --title "chore(home): sync GoldFinder release version" \
              --body "Automated weekly sync of GoldFinder's latest GitHub Release tag in \`src/data/home.ts\`."
          else
            echo "Updated existing PR #$existing"
          fi
